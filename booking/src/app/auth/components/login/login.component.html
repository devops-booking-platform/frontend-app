<div class="container mt-5" style="max-width: 400px;">
    <h3 class="mb-3">Login</h3>

    <form [formGroup]="form" (ngSubmit)="submit()">

        <div class="mb-3">
            <input class="form-control" placeholder="Username" formControlName="username" />
            <div class="text-danger" *ngIf="form.controls.username.touched && form.controls.username.invalid">
                Username is required
            </div>
        </div>

        <div class="mb-3">
            <div class="input-group">
                <input class="form-control" placeholder="Password" [type]="showPassword ? 'text' : 'password'"
                    formControlName="password" />

                <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword">
                    <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                </button>
            </div>

            <div class="text-danger" *ngIf="form.controls.password.touched && form.controls.password.invalid">
                Password is required
            </div>
        </div>

        <button class="btn btn-primary w-100" [disabled]="form.invalid">
            Login
        </button>
    </form>
</div>

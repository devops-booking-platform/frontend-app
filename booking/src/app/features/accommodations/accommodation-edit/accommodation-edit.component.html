<div class="container mt-5">

    <h2 class="fw-bold text-center mb-4">
        {{ id ? 'Edit Accommodation' : 'Create Accommodation' }}
    </h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form [formGroup]="form" (ngSubmit)="submit()">

                <!-- BASIC INFO -->
                <h5 class="mb-3">Basic Information</h5>
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Name *</label>
                        <input type="text" class="form-control" formControlName="name">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Price Type *</label>
                        <select class="form-select" formControlName="priceType">
                            <option *ngFor="let p of priceTypes" [ngValue]="p.value">{{ p.label }}</option>
                        </select>
                    </div>

                </div>

                <hr class="my-2">

                <!-- LOCATION -->
                <h5 class="mb-3">Location</h5>

                <div formGroupName="location" class="row g-3">

                    <div class="col-md-3">
                        <label class="form-label">Country</label>
                        <input class="form-control" formControlName="country">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">City</label>
                        <input class="form-control" formControlName="city">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Address</label>
                        <input class="form-control" formControlName="address">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Postal Code</label>
                        <input class="form-control" formControlName="postalCode">
                    </div>

                </div>

                <hr class="my-2">

                <!-- GUEST CAPACITY -->
                <h5 class="mb-3">Guest Capacity</h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label>Minimum Guests</label>
                        <input type="number" class="form-control" formControlName="minimumNumberOfGuests" min="1">
                    </div>

                    <div class="col-md-6">
                        <label>Maximum Guests</label>
                        <input type="number" class="form-control" formControlName="maximumNumberOfGuests" min="1">
                    </div>

                </div>

                <hr class="my-2">

                <!-- DESCRIPTION -->
                <h5 class="mb-3">Description</h5>
                <textarea class="form-control" rows="2" formControlName="description"></textarea>

                <hr class="my-2">

                <!-- PHOTOS -->
                <h5 class="mb-3">Photos</h5>
                <input type="text" class="form-control" [value]="form.controls['photos'].value?.join(', ')"
                    (input)="onPhotosChange($event)" placeholder="https://img1.jpg, https://img2.jpg">

                <hr class="my-2">
                <h5 class="mb-3">Amenities</h5>
                <div class="row">
                    <div class="col-md-6 col-12">
                        <mat-form-field appearance="outline">
                            <mat-label>Amenities</mat-label>
                            <mat-select formControlName="amenities" multiple>
                                <mat-option *ngFor="let a of amenities" [value]="a.id" [matTooltip]="a.description"
                                    matTooltipPosition="right">
                                    {{ a.name }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                    <div class="col-md-6 col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" formControlName="isAutoConfirm">
                            <label class="form-check-label">Enable Automatic Confirmation</label>
                        </div>
                    </div>
                </div>



                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary px-4">
                        {{ id ? 'Update' : 'Create' }}
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

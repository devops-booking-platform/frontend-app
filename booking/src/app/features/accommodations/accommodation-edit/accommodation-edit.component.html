<div class="container mt-5">

    <h2 class="fw-bold text-center mb-4">{{ id ? 'Edit' : 'Create' }} Accommodation</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form [formGroup]="form" (ngSubmit)="submit()">

                <h5 class="mb-3">Basic Information</h5>
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Name *</label>
                        <input type="text" class="form-control" formControlName="name"
                            placeholder="e.g. Sunny Apartment">
                        <div class="invalid-feedback d-block"
                            *ngIf="form.controls['name'].invalid && form.controls['name'].touched">
                            Name is required.
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Price Type *</label>
                        <select class="form-select" formControlName="priceType">
                            <option [ngValue]="0">Per Night</option>
                            <option [ngValue]="1">Per Person</option>
                        </select>
                    </div>

                </div>


                <hr class="my-4">

                <h5 class="mb-3">Location</h5>
                <div formGroupName="location" class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label">Country</label>
                        <input type="text" class="form-control" formControlName="country" placeholder="e.g. Serbia">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">City</label>
                        <input type="text" class="form-control" formControlName="city" placeholder="e.g. Belgrade">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" formControlName="address"
                            placeholder="e.g. Kneza Mihaila 10">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Postal Code</label>
                        <input type="text" class="form-control" formControlName="postalCode" placeholder="11000">
                    </div>

                </div>


                <hr class="my-4">

                <h5 class="mb-3">Guest Capacity</h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Minimum Guests</label>
                        <input type="number" min="1" class="form-control" formControlName="minimumNumberOfGuests">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Maximum Guests</label>
                        <input type="number" min="1" class="form-control" formControlName="maximumNumberOfGuests">
                    </div>

                </div>


                <hr class="my-4">

                <h5 class="mb-3">Description</h5>
                <div>
                    <textarea rows="4" class="form-control" formControlName="description"
                        placeholder="Describe accommodation, nearby attractions, etc."></textarea>
                </div>


                <hr class="my-4">

                <h5 class="mb-3">Photos</h5>
                <div class="mb-3">
                    <label class="form-label">Image URLs (comma separated)</label>
                    <input type="text" class="form-control" formControlName="photos"
                        placeholder="https://image1.jpg, https://image2.jpg">
                </div>


                <h5 class="mb-3 mt-4">Amenities</h5>
                <div class="mb-3">
                    <label class="form-label">Amenities (comma separated)</label>
                    <input type="text" class="form-control" formControlName="amenities"
                        placeholder="WiFi, Parking, AC, TV">
                </div>


                <hr class="my-4">

                <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" formControlName="isAutoConfirm">
                    <label class="form-check-label">Enable Automatic Confirmation</label>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary px-4">Create</button>
                </div>

            </form>

        </div>
    </div>

</div>

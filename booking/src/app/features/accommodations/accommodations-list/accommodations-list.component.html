<div class="container mt-5">

    <h2 class="mb-4 fw-bold text-center">Accommodations</h2>

    <!-- Search Filters -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">Filters</h5>

            <form [formGroup]="form" (ngSubmit)="search()">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Country</label>
                        <input type="text" class="form-control" formControlName="country">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">City</label>
                        <input type="text" class="form-control" formControlName="city">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Guests</label>
                        <input type="number" class="form-control" formControlName="guests">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Start Date</label>
                        <input type="date" class="form-control" formControlName="start">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">End Date</label>
                        <input type="date" class="form-control" formControlName="end">
                    </div>

                </div>

                <div class="d-flex justify-content-end mt-4">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-search me-1"></i> Search
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Results -->
    <div class="card shadow-sm" *ngIf="results.length > 0">
        <div class="card-body">

            <h5 class="card-title mb-3">Results</h5>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th (click)="sort('name')" role="button">
                                Name
                                <span *ngIf="sortColumn === 'name'">
                                    <i
                                        [ngClass]="sortDirection === 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'"></i>
                                </span>
                            </th>
                            <th (click)="sort('country')" role="button">
                                Country
                                <span *ngIf="sortColumn === 'country'">
                                    <i
                                        [ngClass]="sortDirection === 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'"></i>
                                </span>
                            </th>

                            <th (click)="sort('city')" role="button">
                                City
                                <span *ngIf="sortColumn === 'city'">
                                    <i
                                        [ngClass]="sortDirection === 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'"></i>
                                </span>
                            </th>

                            <th (click)="sort('totalPrice')" role="button">
                                Total price
                                <span *ngIf="sortColumn === 'totalPrice'">
                                    <i
                                        [ngClass]="sortDirection === 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'"></i>
                                </span>
                            </th>

                            <th (click)="sort('maxGuests')" role="button">
                                Max Guests
                                <span *ngIf="sortColumn === 'maxGuests'">
                                    <i
                                        [ngClass]="sortDirection === 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'"></i>
                                </span>
                            </th>

                        </tr>
                    </thead>

                    <tbody>
                        <tr *ngFor="let r of results">
                            <td>{{ r.name }}</td>
                            <td>{{ r.country }}</td>
                            <td>{{ r.city }}</td>
                            <td>{{ r.totalPrice }} €</td>
                            <td>{{ r.maxGuests }}</td>
                        </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </div>

    <div class="alert alert-info text-center mt-4" *ngIf="results.length === 0 && searched">
        No accommodations found for the selected criteria.
    </div>

</div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">My Accommodations</h2>

        <button class="btn btn-primary shadow-sm" (click)="navigateToCreate()">
            <i class="bi bi-plus-circle me-1"></i> New Accommodation
        </button>
    </div>

    <div *ngIf="accommodations.length === 0" class="text-center text-muted mt-5">
        <p>No accommodations created yet.</p>
    </div>

    <!-- Cards Grid -->
    <div class="row g-4">

        <div class="col-md-6 col-lg-4" *ngFor="let acc of accommodations">
            <div class="card shadow-sm h-100 accommodation-card">

                <div class="card-body d-flex flex-column">

                    <h5 class="card-title fw-bold">{{ acc.name }}</h5>

                    <p class="text-muted small mb-2" *ngIf="acc.address">
                        {{ acc.address }}
                    </p>

                    <p class="mb-2">
                        Guests:
                        <strong>{{ acc.minGuests }}</strong>–
                        <strong>{{ acc.maxGuests }}</strong>
                    </p>

                    <div class="mt-auto">
                        <button class="btn btn-outline-primary w-100">
                            View Details
                        </button>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

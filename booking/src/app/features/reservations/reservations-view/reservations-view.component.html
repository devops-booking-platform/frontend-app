<div class="container mt-5">

    <h2 class="mb-4 fw-bold text-center">Reservations</h2>

    <!-- Filters -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form>
                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label">Status</label>
                        <select class="form-select" [(ngModel)]="statusFilter" (change)="applyFilters()" name="status">
                            <option value="None">--</option>
                            <option value="Pending">Pending</option>
                            <option value="Approved">Approved</option>
                            <option value="Rejected">Rejected</option>
                            <option value="CancelledByGuest">Cancelled by Guest</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm" *ngIf="reservations?.items?.length">

        <div class="card-body">
            <h5 class="card-title mb-3">Reservations</h5>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th role="button">
                                Accommodation
                                <span *ngIf="sortColumn === 'accommodationName'">
                                    <i
                                        [ngClass]="sortDirection === 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'"></i>
                                </span>
                            </th>

                            <th role="button">
                                Guest
                                <span *ngIf="sortColumn === 'guestUsername'">
                                    <i
                                        [ngClass]="sortDirection === 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'"></i>
                                </span>
                            </th>

                            <th role="button">
                                Start Date
                            </th>

                            <th role="button">
                                End Date
                            </th>

                            <th role="button">
                                Total Price
                                <span *ngIf="sortColumn === 'totalPrice'">
                                    <i
                                        [ngClass]="sortDirection === 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'"></i>
                                </span>
                            </th>

                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr *ngFor="let r of reservations.items">
                            <td>{{ r.accommodationName }}</td>
                            <td>{{ r.guestUsername }}</td>
                            <td>{{ r.startDate }}</td>
                            <td>{{ r.endDate }}</td>
                            <td>{{ r.totalPrice }} €</td>
                            <td>
                                <span class="badge bg-secondary">{{ getStatusLabel(r.status) }}</span>
                            </td>
                            <td
                                *ngIf="getStatusLabel(r.status) === 'Approved'">
                                <button class="btn btn-sm btn-danger" (click)="cancelReservation(r.id)">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <nav class="mt-3">
                <ul class="pagination justify-content-center">

                    <li class="page-item" [class.disabled]="page === 1">
                        <button class="page-link" (click)="onPageChange(page - 1)">Previous</button>
                    </li>

                    <li class="page-item"
                        *ngFor="let p of [].constructor(Math.ceil(reservations.totalCount / pageSize)); let i = index"
                        [class.active]="page === i + 1">
                        <button class="page-link" (click)="onPageChange(i + 1)">
                            {{ i + 1 }}
                        </button>
                    </li>

                    <li class="page-item" [class.disabled]="page >= reservations.totalCount / pageSize">
                        <button class="page-link" (click)="onPageChange(page + 1)">Next</button>
                    </li>

                </ul>
            </nav>

        </div>
    </div>

    <div class="alert alert-info text-center mt-4" *ngIf="reservations && reservations.items.length === 0">
        No reservations found.
    </div>

</div>

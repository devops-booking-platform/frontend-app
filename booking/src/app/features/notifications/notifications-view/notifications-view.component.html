<div class="container mt-4">

    <h2 class="mb-4 text-center">Notifications</h2>

    <div *ngIf="loading" class="text-center my-4">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div *ngIf="!loading && notifications.length === 0" class="alert alert-info text-center">
        No notifications found.
    </div>

    <div *ngIf="notifications.length > 0" class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Type</th>
                            <th>Content</th>
                            <th>Created At</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let n of notifications">
                            <td>
                                <span class="badge" [ngClass]="getBadgeClass(n.notificationType)">
                                    {{ getTypeLabel(n.notificationType) }}
                                </span>
                            </td>
                            <td>{{ n.message }}</td>
                            <td>{{ n.createdOn | date:'short' }}</td>
                            <td>
                                <span class="badge" [ngClass]="n.read ? 'bg-success' : 'bg-secondary'">
                                    {{ n.read ? 'Read' : 'Unread' }}
                                </span>
                            </td>
                            <td>
                                <button *ngIf="!n.read" class="btn btn-sm btn-primary" (click)="markAsRead(n.id)">
                                    Mark as Read
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <nav class="mt-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" [class.disabled]="page === 1">
                        <button class="page-link" (click)="onPageChange(page - 1)">Previous</button>
                    </li>

                    <li class="page-item"
                        *ngFor="let p of [].constructor(Math.ceil(totalCount / pageSize)); let i = index"
                        [class.active]="page === i + 1">
                        <button class="page-link" (click)="onPageChange(i + 1)">{{ i + 1 }}</button>
                    </li>

                    <li class="page-item" [class.disabled]="page >= totalCount / pageSize">
                        <button class="page-link" (click)="onPageChange(page + 1)">Next</button>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</div>

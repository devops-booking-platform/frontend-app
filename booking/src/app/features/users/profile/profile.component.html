<div class="d-flex justify-content-end">
        <button class="btn btn-outline-danger btn-delete" data-bs-toggle="modal" data-bs-target="#deleteAccountModal">
            <i class="bi bi-trash me-1"></i>
            Delete account
        </button>
    </div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card shadow-sm">
                <div class="d-flex justify-content-center align-items-center card-header bg-primary text-white">
                    <h4>My Profile</h4>
                </div>

                <div class="card-body">
                    <form [formGroup]="form" (ngSubmit)="submit()">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input class="form-control" formControlName="username" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" formControlName="email" />
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First name</label>
                                <input class="form-control" formControlName="firstName" />
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last name</label>
                                <input class="form-control" formControlName="lastName" />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Address</label>
                            <input class="form-control" formControlName="address" />
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <button type="button" class="btn btn-outline-secondary" (click)="goToChangePassword()">
                                Change password
                            </button>
                            <button type="submit" class="btn btn-primary px-4" [disabled]="form.invalid">
                                Save changes
                            </button>
                        </div>


                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Delete Account Modal -->
<div class="modal fade" id="deleteAccountModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title text-danger">Delete account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <p>
                    Are you sure you want to delete your account?
                </p>
                <p class="text-muted mb-0">
                    This action is permanent and cannot be undone.
                </p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>

                <button type="button" class="btn btn-danger" (click)="confirmDeleteAccount()">
                    Yes, delete
                </button>
            </div>

        </div>
    </div>
</div>

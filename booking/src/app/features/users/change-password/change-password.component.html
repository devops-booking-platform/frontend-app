<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">

            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">Change Password</h5>
                </div>

                <div class="card-body">
                    <form [formGroup]="form" (ngSubmit)="submit()">

                        <!-- Current password -->
                        <div class="mb-3">
                            <label class="form-label">Current password</label>
                            <div class="input-group">
                                <input class="form-control" [type]="showCurrent ? 'text' : 'password'"
                                    formControlName="currentPassword" />
                                <button class="btn btn-outline-secondary" type="button"
                                    (click)="showCurrent = !showCurrent">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- New password -->
                        <div class="mb-4">
                            <label class="form-label">New password</label>
                            <div class="input-group">
                                <input class="form-control" [type]="showNew ? 'text' : 'password'"
                                    formControlName="newPassword" />
                                <button class="btn btn-outline-secondary" type="button" (click)="showNew = !showNew">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <small class="text-muted">
                                Minimum 8 characters
                            </small>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button class="btn btn-warning px-4" type="submit" [disabled]="!form.valid">
                                Change password
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
